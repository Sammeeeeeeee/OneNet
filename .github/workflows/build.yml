name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Version to release, e.g. v0.2 (needs .github/releases/<version>.md). Empty for a plain build.
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Android 17 SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - run: ./gradlew testDebugUnitTest assembleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: onenet-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk

  # Publishes the build as a GitHub release: push a v* tag, or run the workflow with a version.
  # Notes come from .github/releases/<version>.md.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: onenet-${{ github.run_number }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.release || github.ref_name }}
        run: |
          mv app-release.apk "OneNet-$VERSION.apk"
          gh release create "$VERSION" "OneNet-$VERSION.apk" --target "$GITHUB_SHA" \
            --title "OneNet $VERSION" --notes-file ".github/releases/$VERSION.md"
